name: Deploy consumer app to GitHub Pages

on:
  push:
    branches:
      - claude/home-tax-bill-analyzer-oksov1
      - main
    paths:
      - 'consumer-app/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: consumer-app/package-lock.json

      - name: Install dependencies
        working-directory: consumer-app
        run: npm ci

      - name: Run tests
        working-directory: consumer-app
        run: npm test

      - name: Build (with repo-name base path for project pages)
        working-directory: consumer-app
        run: npm run build -- --base=/${{ github.event.repository.name }}/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: consumer-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
